<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vida Marinha - Contatos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="container">

    <header>
        <h1>🌊 Vida Marinha</h1>
        <p>Entre em contato conosco</p>
    </header>

    <nav>
        <a href="index.html">Início</a>
        <a href="sobre.html">Sobre</a>
        <a href="contatos.html">Contatos</a>
    </nav>

    <main>
        <h2>Contatos</h2>

        <p>
            Gostou do nosso projeto? Preencha o formulário abaixo
            para deixar uma mensagem.
        </p>

        <form>
            <label for="nome">Nome:</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="email">E-mail:</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" placeholder="Digite sua mensagem"></textarea>

            <button type="submit">Enviar</button>
        </form>

        <div class="caixas">
            <div class="caixa">
                <h2>📧 E-mail</h2>
                <p>vidamarinha@email.com</p>
            </div>

            <div class="caixa">
                <h2>📱 Telefone</h2>
                <p>(11) 99999-9999</p>
            </div>
        </div>
    </main>

    <footer>
        <p>Mini-site desenvolvido para atividade de HTML e CSS.</p>
    </footer>

</div>

</body>
</html>
